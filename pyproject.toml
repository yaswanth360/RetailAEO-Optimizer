[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "surfaced-aeo"
version = "0.1.0"
description = "Open-source answer engine optimization agents for retail sellers: score, optimize, and create content."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["httpx>=0.27", "pyyaml>=6", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
surfaced = "surfaced.cli:main"

[tool.setuptools.packages.find]
include = ["surfaced*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
